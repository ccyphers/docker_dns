version: "3"

services:
  pihole:
    container_name: pihole
    image: ccyphers/pihole:latest
    privileged: true
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8118:8118/tcp"
    environment:
      TZ: 'America/Chicago'
    volumes:
      - './etc-pihole:/etc/pihole'
      - './init.sh:/init.sh'
#      - './etc-dnsmasq.d:/etc/dnsmasq.d'
#      - './dnsmasq.conf:/etc/dnsmasq.conf'
    cap_add:
      - NET_ADMIN
    
